[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disco-astronomy"
version = "1.3.0"
description = "Deprojection Image Software for Circumstellar Objects"
authors = [
  { name="astrojorgeluis", email="jorge.guzman.l@usach.cl" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart",
    "astropy>=6.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "astroquery>=0.4.7",
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
disco-start = "disco.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["disco*"]

[tool.setuptools.package-data]
disco = ["models/*.pth", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: longer-running geometry recovery tests",
]
filterwarnings = [
    "ignore::astropy.wcs.FITSFixedWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
